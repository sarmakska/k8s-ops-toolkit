# A minimal deployment with the optional pieces switched off: no ingress,
# no autoscaling, no PDB, no ServiceMonitor. Exercises the gating in the
# templates so they render nothing rather than broken objects.
replicas: 1

image:
  repository: ghcr.io/acme/worker
  tag: latest

ingress:
  enabled: false
  className: nginx
  host: unused.example
  tls:
    enabled: false
    issuer: letsencrypt-prod

autoscaling:
  enabled: false
  min: 1
  max: 1
  targetCPU: 80

pdb:
  enabled: false
  minAvailable: 1

monitoring:
  enabled: false
  prometheusServiceMonitor: false
  metricsPath: /api/metrics
