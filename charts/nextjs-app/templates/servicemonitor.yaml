{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusServiceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.metricsPath }}
      interval: 30s
{{- end }}
