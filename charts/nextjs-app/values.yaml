replicas: 2

image:
  repository: ghcr.io/your-org/your-app
  tag: latest
  pullPolicy: IfNotPresent
  # Names of pre-existing image pull secrets for private registries.
  pullSecrets: []

# Rolling update tuning. The defaults keep capacity available during a
# deploy while allowing one extra pod to come up before an old one goes.
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

service:
  port: 3000

ingress:
  enabled: true
  className: nginx
  host: app.example.com
  # Extra ingress annotations, for example proxy body size limits.
  annotations: {}
  tls:
    enabled: true
    issuer: letsencrypt-prod

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  min: 2
  max: 10
  targetCPU: 70

# Pod disruption budget keeps a floor of available replicas during
# voluntary disruptions such as node drains.
pdb:
  enabled: true
  minAvailable: 1

# Scheduling controls. The default topology spread keeps replicas off the
# same zone and node so a single zone or node failure cannot take the whole
# app down, which is the resilience the PDB above assumes. Set spread.enabled
# to false on a single-node cluster (kind, minikube) where the constraints
# cannot be satisfied. nodeSelector, affinity and tolerations are passed
# through verbatim when set.
scheduling:
  spread:
    enabled: true
    # ScheduleAnyway lets pods land even when a zone is full, rather than
    # leaving them Pending. Flip to DoNotSchedule for hard isolation.
    whenUnsatisfiable: ScheduleAnyway
    # Topology keys to spread across, widest blast radius first.
    topologyKeys:
      - topology.kubernetes.io/zone
      - kubernetes.io/hostname
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Seconds the kubelet waits for graceful shutdown before sending SIGKILL.
# Next.js needs a short window to drain in-flight requests on a deploy.
terminationGracePeriodSeconds: 30

# Pod and container security context. The defaults run the app as a
# non-root user with a read-only root filesystem disabled, which is the
# safe baseline for a standard Next.js image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 5

# Inline non-secret environment variables.
env: []
# Individual secret-backed environment variables, one Secret key each.
secretEnv: []
# Whole Secrets mounted as environment variables via envFrom.
envFromSecret: []

monitoring:
  enabled: true
  prometheusServiceMonitor: true
  metricsPath: /api/metrics
  metricsPort: 3000
  interval: 30s
  # Extra labels so a kube-prometheus-stack with a release selector picks
  # up the ServiceMonitor. Set release to your monitoring release name.
  serviceMonitorLabels:
    release: monitoring
